[package]
name = "bannerbay"
version = "0.1.0"
edition = "2024"
description = "Make README banners and social cards in seconds, right in the browser."
license = "MIT"

[dependencies]
dioxus = { version = "0.7", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[features]
default = ["web"]
web = ["dioxus/web"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
# Not `strip = true`: newer Rust then strips the custom sections wasm-bindgen needs. Debug info only.
strip = "debuginfo"
