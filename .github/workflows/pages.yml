name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces an unfinished one.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Keep in step with the dx version used locally (`dx --version`).
  DX_VERSION: "0.7.10"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Install the Dioxus CLI
        run: |
          base="https://github.com/DioxusLabs/dioxus/releases/download/v${DX_VERSION}"
          curl -fsSL -o dx.tar.gz "${base}/dx-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o dx.sha256 "${base}/dx-x86_64-unknown-linux-gnu.sha256"
          sha256sum --check --ignore-missing dx.sha256
          mkdir dx-bin
          tar -xzf dx.tar.gz -C dx-bin
          sudo install -m 755 "$(find dx-bin -type f -name dx | head -n 1)" /usr/local/bin/dx
          dx --version

      - name: Build the site
        run: dx build --release --platform web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/dx/bannerbay/release/web/public

  deploy:
    needs: build
    # Free GitHub Pages needs a public repository, so a private repo only builds and tests.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
